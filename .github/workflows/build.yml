# main 푸시·PR·수동 실행마다 헤드리스 검사(규칙 run_tests · 화면 run_view_tests · 100세대 짧은 실험 · 분석 도구 unittest)를 돌린다.
# Linux·Windows 내보내기는 1단계 5/5 순서(docs/DESIGN-v0.1.md 15절)에서 export_presets.cfg 와 함께 추가.
# 검사 로그에 SCRIPT ERROR 가 있으면 실패(Godot 은 오류 난 함수만 멈추고 계속 돌아 RESULT 가 0 failed 로 남을 수 있음).
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.4.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot 내려받기
        run: |
          set -e
          B="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$B/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && chmod +x godot
          rm godot.zip

      - name: 가져오기
        run: ./godot --headless --path . --import 2>&1 | tail -3

      - name: 규칙 검사(run_tests)
        run: |
          ./godot --headless --path . --script res://tests/run_tests.gd 2>&1 | tee /tmp/t1.log | grep -E "^(PASS|FAIL|RESULT)|실패|성능|농사 도달|SCRIPT ERROR"
          grep -q "^RESULT: .* 0 failed" /tmp/t1.log
          # 설정·스냅숏 검사는 일부러 깨진 JSON 을 읽어 엔진 "ERROR: Parse JSON failed" 를 내므로 여기서는 SCRIPT ERROR 만 본다
          if grep -n "SCRIPT ERROR" /tmp/t1.log; then exit 1; fi

      - name: 화면 검사(run_view_tests, 헤드리스)
        run: |
          ./godot --headless --path . --script res://tests/run_view_tests.gd 2>&1 | tee /tmp/t3.log | grep -E "^(PASS|FAIL|RESULT)|실패|MapView 시간|예산\(|SCRIPT ERROR|^ERROR:"
          grep -q "^RESULT: .* 0 failed (view)" /tmp/t3.log
          # 화면 검사 로그에는 엔진 오류가 하나도 없어야 한다(검사 모듈이 중간에 끊겨도 PASS 로 보이지 않게)
          if grep -nE "SCRIPT ERROR|^ERROR:" /tmp/t3.log; then exit 1; fi

      - name: 헤드리스 실험 짧게(100세대)
        run: |
          ./godot --headless --path . --script res://tests/run_experiment.gd -- --seed=1 --generations=100 --out=results/ci --quiet 2>&1 | tee /tmp/t2.log | tail -1
          grep -q "^RESULT: .*reason=generations" /tmp/t2.log
          if grep -n "SCRIPT ERROR" /tmp/t2.log; then exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: experiment-seed1-100gen
          path: results/ci
          retention-days: 14

      # 오프라인 분석 도구(파이썬). GODOT 를 주면 실제 실행기로 아주 짧은 묶음도 한 번 돌린다.
      - name: 분석 도구 검사(tools/test_analyze.py)
        env:
          GODOT: ${{ github.workspace }}/godot
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          python3 -m pip install -q -r tools/requirements.txt
          python3 -m unittest discover -s tools -p "test_*.py" -v
