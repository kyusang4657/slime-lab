# main 푸시·PR·수동 실행·v* 태그마다:
#   test    — 헤드리스 검사(규칙 run_tests · 화면 run_view_tests · 100세대 짧은 실험 · 분석 도구 unittest)
#   export  — 검사를 통과하면 Linux·Windows·웹(체험판) 내보내기, Linux 실행 파일을 헤드리스로 잠깐 띄워 확인, 산출물 올림
#   pages   — main 푸시면 웹 체험판을 GitHub Pages(https://kyusang4657.github.io/slime-lab/)에 배포
#   release — v* 태그면 Linux·Windows zip 을 GitHub Release 에 붙임
# 검사 로그에 SCRIPT ERROR 가 있으면 실패(Godot 은 오류 난 함수만 멈추고 계속 돌아 RESULT 가 0 failed 로 남을 수 있음).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.4.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot 내려받기
        run: |
          set -e
          B="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$B/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && chmod +x godot
          rm godot.zip

      - name: 가져오기
        run: ./godot --headless --path . --import 2>&1 | tail -3

      - name: 규칙 검사(run_tests)
        run: |
          ./godot --headless --path . --script res://tests/run_tests.gd 2>&1 | tee /tmp/t1.log | grep -E "^(PASS|FAIL|RESULT)|실패|성능|농사 도달|SCRIPT ERROR"
          grep -q "^RESULT: .* 0 failed" /tmp/t1.log
          # 설정·스냅숏 검사는 일부러 깨진 JSON 을 읽어 엔진 "ERROR: Parse JSON failed" 를 내므로 여기서는 SCRIPT ERROR 만 본다
          if grep -n "SCRIPT ERROR" /tmp/t1.log; then exit 1; fi

      - name: 화면 검사(run_view_tests, 헤드리스)
        run: |
          ./godot --headless --path . --script res://tests/run_view_tests.gd 2>&1 | tee /tmp/t3.log | grep -E "^(PASS|FAIL|RESULT)|실패|MapView 시간|예산\(|SCRIPT ERROR|^ERROR:"
          grep -q "^RESULT: .* 0 failed (view)" /tmp/t3.log
          # 화면 검사 로그에는 엔진 오류가 하나도 없어야 한다(검사 모듈이 중간에 끊겨도 PASS 로 보이지 않게)
          if grep -nE "SCRIPT ERROR|^ERROR:" /tmp/t3.log; then exit 1; fi

      - name: 헤드리스 실험 짧게(100세대)
        run: |
          ./godot --headless --path . --script res://tests/run_experiment.gd -- --seed=1 --generations=100 --out=results/ci --quiet 2>&1 | tee /tmp/t2.log | tail -1
          grep -q "^RESULT: .*reason=generations" /tmp/t2.log
          if grep -n "SCRIPT ERROR" /tmp/t2.log; then exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: experiment-seed1-100gen
          path: results/ci
          retention-days: 14

      # 오프라인 분석 도구(파이썬). GODOT 를 주면 실제 실행기로 아주 짧은 묶음도 한 번 돌린다.
      - name: 분석 도구 검사(tools/test_analyze.py)
        env:
          GODOT: ${{ github.workspace }}/godot
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          python3 -m pip install -q -r tools/requirements.txt
          python3 -m unittest discover -s tools -p "test_*.py" -v

  export:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot 와 내보내기 템플릿(Linux·Windows·웹 스레드 없음) 내려받기
        run: |
          set -e
          B="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$B/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && chmod +x godot
          curl -sSL -o templates.tpz "$B/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T"
          unzip -q -j templates.tpz templates/linux_release.x86_64 templates/windows_release_x86_64.exe \
            templates/web_nothreads_release.zip templates/version.txt -d "$T"
          rm godot.zip templates.tpz

      - name: 가져오기
        run: ./godot --headless --path . --import 2>&1 | tail -3

      - name: 내보내기(Linux·Windows·웹)
        run: |
          set -e
          mkdir -p build/linux build/windows build/web
          ./godot --headless --path . --export-release "Linux" build/linux/slime-lab.x86_64 2>&1 | grep -iv alsa | tail -2
          ./godot --headless --path . --export-release "Windows Desktop" build/windows/slime-lab.exe 2>&1 | grep -iv alsa | tail -2
          ./godot --headless --path . --export-release "Web" build/web/index.html 2>&1 | grep -iv alsa | tail -2
          test -s build/linux/slime-lab.x86_64 && test -s build/windows/slime-lab.exe
          test -s build/web/index.html && test -s build/web/index.wasm && test -s build/web/index.pck
          touch build/web/.nojekyll
          ls -la build/*

      - name: Linux 실행 파일 잠깐 띄워 보기(헤드리스, 오류 없이 200프레임)
        run: |
          ./build/linux/slime-lab.x86_64 --headless --quit-after 200 2>&1 | tee /tmp/run.log | grep -v ALSA | tail -5
          if grep -nE "SCRIPT ERROR" /tmp/run.log; then exit 1; fi

      - name: 묶기(zip, 라이선스·출처·글꼴 라이선스 포함)
        run: |
          set -e
          for p in linux windows; do
            cp LICENSE CREDITS.md assets/fonts/OFL-NanumGothic.txt build/$p/
            (cd build/$p && zip -q -r ../slime-lab-0.1.0-$p.zip .)
          done
          ls -la build/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: slime-lab-linux
          path: build/slime-lab-0.1.0-linux.zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: slime-lab-windows
          path: build/slime-lab-0.1.0-windows.zip
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: export
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: slime-lab-*
          merge-multiple: true
      - name: GitHub Release 에 붙이기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la
          gh release create "${GITHUB_REF_NAME}" slime-lab-*.zip --repo "${GITHUB_REPOSITORY}" \
            --title "슬라임 인공생명 실험실 ${GITHUB_REF_NAME}" --notes "Linux·Windows 실행 파일(서명 없음). 웹 체험판: https://kyusang4657.github.io/slime-lab/" \
            || gh release upload "${GITHUB_REF_NAME}" slime-lab-*.zip --repo "${GITHUB_REPOSITORY}" --clobber
